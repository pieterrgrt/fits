# Elke push naar main: eerst bouwen en testen, dan (als de geheimen zijn ingesteld) online zetten.
# Instellen: docs/online-zetten.md, onder "Automatisch online zetten".
name: Online zetten

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-zetten-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  online:
    needs: bouwen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SERVER: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Geheimen aanwezig?
        id: klaar
        run: echo "ja=$([ -n "$SERVER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: SSH klaarzetten
        if: steps.klaar.outputs.ja == 'true'
        env:
          SLEUTEL: ${{ secrets.DEPLOY_SSH_KEY }}
          BEKENDE_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SLEUTEL" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$BEKENDE_HOSTS" > ~/.ssh/known_hosts

      # De sleutel mag op de server alleen deploy/update.sh draaien (zie authorized_keys).
      - name: Nieuwe versie bouwen op de server
        if: steps.klaar.outputs.ja == 'true'
        run: ssh -T -i ~/.ssh/deploy -o BatchMode=yes "root@$SERVER"

      - name: Controleren of de app antwoordt
        if: steps.klaar.outputs.ja == 'true'
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null https://fits.alduslab.eu/gezond
