services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Achter nginx: het adres zoals de browser het ziet (https), voor de beveiliging van formulieren.
      PROTOCOL_HEADER: x-forwarded-proto
    volumes:
      - fits-data:/data
    # Alleen bereikbaar op de server zelf; de nginx van de server stuurt fits.alduslab.eu hierheen.
    # Poort bezet? Zet FITS_POORT=8006 (of een andere) in .env.
    ports:
      - "127.0.0.1:${FITS_POORT:-8005}:3000"

volumes:
  # De database staat in een Docker-volume (eigenaar: de node-gebruiker in de container).
  fits-data:
